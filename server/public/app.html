<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockLink - Axure 原型托管</title>
<style>
  :root {
    --bg: #f2f3f5;
    --surface: #ffffff;
    --ink: #1a1a1a;
    --ink-secondary: #4a4a4a;
    --muted: #919191;
    --muted-light: #bfbfbf;
    --rule: #e8e8e8;
    --rule-light: #f0f0f0;
    --accent: #3f8d61;
    --accent-hover: #357a52;
    --accent-bg: rgba(63, 141, 97, 0.08);
    --danger: #fe0000;
    --danger-bg: rgba(254, 0, 0, 0.06);
    --danger-hover: #e60000;
    --warning: #fa8c16;
    --warning-bg: rgba(250, 140, 22, 0.08);
    --radius: 8px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-lg: 0 4px 24px rgba(0,0,0,0.08);
    --header-h: 56px;
    --sidebar-w: 240px;
    --transition: all 0.15s ease;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "SF Pro Text", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ===== Header ===== */
  .header {
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
  }
  .header .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.5px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .search {
    flex: 1;
    max-width: 400px;
    position: relative;
  }
  .header .search input {
    width: 100%;
    height: 36px;
    padding: 0 12px 0 36px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    background: var(--bg);
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: var(--transition);
  }
  .header .search input:focus {
    border-color: var(--accent);
    background: var(--surface);
  }
  .header .search input::placeholder { color: var(--muted); }
  .header .search .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--muted);
  }
  .header .nav-right {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .header .nav-right .btn-icon {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-secondary);
    transition: var(--transition);
    position: relative;
  }
  .header .nav-right .btn-icon:hover {
    background: var(--bg);
    color: var(--ink);
  }
  .header .nav-right .btn-icon svg { width: 18px; height: 18px; }
  .header .nav-right .btn-icon .badge-count {
    position: absolute;
    top: -2px;
    right: -2px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  /* ===== Layout: Sidebar + Main ===== */
  .layout {
    display: flex;
    min-height: calc(100vh - var(--header-h));
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--rule);
    flex-shrink: 0;
    padding: 16px 0;
    overflow-y: auto;
    position: sticky;
    top: var(--header-h);
    max-height: calc(100vh - var(--header-h));
  }
  .sidebar-section {
    margin-bottom: 8px;
  }
  .sidebar-section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 0 20px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-section-title .add-group-btn {
    width: 20px;
    height: 20px;
    border: none;
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: var(--transition);
  }
  .sidebar-section-title .add-group-btn:hover {
    background: var(--bg);
    color: var(--accent);
  }
  .sidebar-section-title .add-group-btn svg { width: 14px; height: 14px; }

  .group-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 20px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    font-size: 13px;
    color: var(--ink-secondary);
  }
  .group-item:hover { background: var(--bg); color: var(--ink); }
  .group-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .group-item .group-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--muted);
  }
  .group-item.active .group-icon { color: var(--accent); }
  .group-item .group-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .group-item .group-count {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .group-item.active .group-count { background: rgba(63,141,97,0.12); color: var(--accent); }
  .group-item .group-actions {
    display: none;
    gap: 2px;
    margin-left: auto;
  }
  .group-item:hover .group-actions { display: flex; }
  .group-item:hover .group-count { display: none; }
  .group-item .group-actions button {
    width: 20px;
    height: 20px;
    border: none;
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: var(--transition);
  }
  .group-item .group-actions button:hover { background: var(--rule-light); color: var(--ink); }
  .group-item .group-actions button.danger:hover { color: var(--danger); }
  .group-item .group-actions button svg { width: 12px; height: 12px; }

  /* Sub-group (second level) */
  .group-children {
    display: none;
  }
  .group-children.expanded { display: block; }
  .group-children .group-item {
    padding-left: 48px;
    font-size: 12px;
  }
  .group-expand {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: transform 0.15s;
  }
  .group-expand.expanded { transform: rotate(90deg); }
  .group-expand svg { width: 12px; height: 12px; }
  .group-expand-placeholder { width: 16px; flex-shrink: 0; }

  /* ===== Main Content ===== */
  .main {
    flex: 1;
    padding: 24px;
    min-width: 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 16px;
  }
  .toolbar h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }
  .toolbar .actions {
    display: flex;
    gap: 8px;
  }
  .btn {
    height: 36px;
    padding: 0 16px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: var(--transition);
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted-light); background: var(--bg); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }
  .btn-danger {
    color: var(--danger);
    border-color: var(--danger);
  }
  .btn-danger:hover {
    background: var(--danger-bg);
  }
  .btn-sm {
    height: 30px;
    padding: 0 10px;
    font-size: 12px;
  }
  .btn-ghost {
    border-color: transparent;
    background: transparent;
    color: var(--ink-secondary);
  }
  .btn-ghost:hover {
    background: var(--bg);
    border-color: var(--rule);
  }
  .user-pill {
    display: none;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 10px 0 4px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--ink);
    background: var(--surface);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .user-pill:hover { border-color: var(--accent); }
  .user-pill.show { display: inline-flex; }
  .user-pill .user-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .user-pill .user-avatar img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .user-pill .user-name {
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .user-pill .chevron {
    width: 14px;
    height: 14px;
    color: var(--muted);
  }
  .user-menu {
    position: relative;
    display: none;
  }
  .user-menu.show { display: inline-flex; }
  .user-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 136px;
    padding: 6px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    z-index: 50;
  }
  .user-dropdown.show { display: block; }
  .user-dropdown button {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  .user-dropdown button:hover { background: var(--bg); }
  .user-dropdown .danger { color: var(--danger); }
  .quota-strip {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink-secondary);
    font-size: 13px;
  }
  .quota-strip.show { display: flex; }
  .quota-strip b { color: var(--ink); }
  .admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .admin-table th, .admin-table td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--rule-light);
    text-align: left;
  }
  .admin-table th { color: var(--muted); font-weight: 500; background: var(--bg); }
  .admin-table .muted {
    color: var(--muted);
    font-size: 12px;
  }
  .admin-toolbar {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 12px;
  }
  .admin-edit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
    margin-top: 4px;
    text-align: left;
  }
  .admin-edit-grid .field-full { grid-column: 1 / -1; }
  .admin-edit-grid label {
    display: block;
    margin-bottom: 2px;
    color: var(--muted);
    font-size: 12px;
  }
  .admin-edit-grid input {
    width: 100%;
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    outline: none;
    font-size: 13px;
  }
  .admin-edit-grid input:focus { border-color: var(--accent); }
  .quota-input {
    width: 90px;
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    outline: none;
  }
  .quota-input:focus { border-color: var(--accent); }

  /* ===== Prototype List ===== */
  .proto-list {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: visible;
  }
  .proto-list-header {
    display: grid;
    grid-template-columns: 1fr 120px 100px 140px 200px;
    gap: 12px;
    padding: 12px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .proto-item {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 120px 100px 140px 200px;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--rule-light);
    align-items: center;
    transition: var(--transition);
    cursor: pointer;
  }
  .proto-item:hover { z-index: 20; }
  .proto-item:last-child { border-bottom: none; }
  .proto-item:hover { background: #fafbfa; }
  .proto-item.disabled { cursor: default; }
  .proto-item.disabled:hover { background: var(--surface); }

  .proto-name {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .proto-name .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .proto-name .status-dot.ready { background: var(--accent); }
  .proto-name .status-dot.cleared { background: var(--warning); }
  .proto-name .status-dot.uploading { background: #1890ff; }
  .proto-name .status-dot.unknown { background: var(--muted-light); }
  .proto-name .name-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .proto-item:hover .name-text { color: var(--accent); }

  .proto-status {
    font-size: 12px;
  }
  .proto-status .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }
  .proto-status .badge.ready { background: var(--accent-bg); color: var(--accent); }
  .proto-status .badge.cleared { background: var(--warning-bg); color: var(--warning); }
  .proto-status .badge.uploading { background: rgba(24,144,255,0.08); color: #1890ff; }

  .proto-size {
    font-size: 13px;
    color: var(--muted);
  }
  .proto-date {
    font-size: 13px;
    color: var(--muted);
  }
  .proto-actions {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
  }
  .proto-more { position: relative; }
  .proto-more-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    min-width: 132px;
    padding: 6px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    box-shadow: 0 16px 38px rgba(17,19,24,.14);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: var(--transition);
    z-index: 1000;
  }
  .proto-more:hover .proto-more-menu { opacity: 1; visibility: visible; transform: translateY(0); }
  .proto-more-menu button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    background: transparent;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
    text-align: left;
  }
  .proto-more-menu button:hover { background: var(--bg); }
  .proto-more-menu button.danger { color: var(--danger); }
  .proto-more-menu button svg { width: 14px; height: 14px; }
  .proto-actions .act-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: var(--transition);
    position: relative;
  }
  .proto-actions .act-btn:hover { background: var(--bg); color: var(--ink); }
  .proto-actions .act-btn.danger:hover { background: var(--danger-bg); color: var(--danger); }
  .proto-actions .act-btn svg { width: 16px; height: 16px; }
  .proto-actions .act-btn .tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 999;
  }
  .proto-actions .act-btn .tooltip::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--ink);
  }
  .proto-actions .act-btn:hover .tooltip { opacity: 1; }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }
  .empty-state .hint { font-size: 12px; margin-top: 4px; color: var(--muted-light); }
  .empty-back-btn {
    margin-top: 14px;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: var(--transition);
  }
  .empty-back-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  /* ===== Loading ===== */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 13px;
  }
  .loading .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 2px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Modal ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.15s ease;
  }
  .modal-overlay.show { display: flex; }
  #confirmModal { z-index: 1200; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    width: 90%;
    max-width: 560px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--rule);
  }
  .modal-header h3 {
    font-size: 16px;
    font-weight: 600;
  }
  .modal-header .close {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    transition: var(--transition);
  }
  .modal-header .close:hover { background: var(--bg); color: var(--ink); }
  .modal-header .close svg { width: 18px; height: 18px; }

  .modal-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Form field */
  .form-field {
    margin-bottom: 16px;
  }
  .form-field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-secondary);
    margin-bottom: 6px;
  }
  .form-field input,
  .form-field select {
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 13px;
    color: var(--ink);
    outline: none;
    cursor: pointer;
    transition: var(--transition);
  }
  .form-field input { cursor: text; }
  .form-field input:focus,
  .form-field select:focus { border-color: var(--accent); }

  /* Upload area in modal */
  .upload-area {
    border: 2px dashed var(--rule);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
  }
  .upload-area:hover, .upload-area.drag {
    border-color: var(--accent);

    color: var(--warning);

    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;

    font-size: 13px;

  }
  .confirm-content .confirm-message {
    font-size: 13px;
    color: var(--muted);

    white-space: pre-wrap;
  }
  #confirmModal.compact-form .modal { max-width: 520px !important; }
  #confirmModal.compact-form .modal-body { padding: 12px 20px 10px; }
  #confirmModal.compact-form .confirm-content { padding: 0; text-align: left; }
  #confirmModal.compact-form .confirm-icon { display: none; }

  /* Share dialog */

    padding: 4px 0;

    font-size: 12px;

  .share-content .share-link input {
    flex: 1;
    height: 38px;

    border-radius: var(--radius-sm);

  /* Group create/edit dialog */

    font-size: 13px;

<script>
const API = '';
let allPrototypes = [];
let allGroups = [];
let selectedGroupId = 'all';
let updatingToken = null;
let editingGroupId = null;
let confirmCallback = null;
let currentUser = null;
let currentUsage = null;
let adminUserCache = [];

function authHeaders(extra = {}) {
  // 管理后台统一使用 HttpOnly Cookie 登录态，避免浏览器残留旧 localStorage token 导致跳转循环。
  return extra;
}

function authFetch(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: authHeaders(options.headers || {}),
  });
}

async function responseError(res) {
  try {
    const data = await res.json();
    return data.error || `HTTP ${res.status}`;
  } catch (e) {
    return `HTTP ${res.status}`;
  }
}

// ===== Initialize =====
document.addEventListener('DOMContentLoaded', async () => {
  setupEventListeners();
  const authed = await refreshAuthState();
  if (!authed) return;
  await loadGroups();
  await loadPrototypes();
});

function setupEventListeners() {
  // New project button
  document.getElementById('newProjectBtn').addEventListener('click', () => {
    updatingToken = null;
    openUploadModal('新建项目');
  });

  // File input
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files).filter(f => f.webkitRelativePath);
    if (files.length) handleFiles(files);
    e.target.value = '';
  });

  // Upload area click
  document.getElementById('uploadArea').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });
  document.getElementById('uploadSubmitBtn').addEventListener('click', () => {
    if (!updatingToken) {
      const projectNameInput = document.getElementById('projectNameInput');
      if (!projectNameInput.value.trim()) {
        showToast('请输入项目名称', 'error');
        projectNameInput.focus();
        return;
      }
    }
    document.getElementById('fileInput').click();
  });

  // Drag and drop
  const uploadArea = document.getElementById('uploadArea');
  ['dragenter','dragover'].forEach(ev => {
    uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(ev => {
    uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.classList.remove('drag'); });
  });
  uploadArea.addEventListener('drop', e => {
    const items = e.dataTransfer.items;
    if (!items) return;
    const files = [];
    const traverse = (entry, cb) => {
      if (entry.isFile) {
        entry.file(f => { f.webkitRelativePath = entry.fullPath.replace(/^\//,''); files.push(f); cb(); });
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        const readAll = () => reader.readEntries(entries => {
          if (!entries.length) { cb(); return; }
          let pending = entries.length;
          entries.forEach(en => traverse(en, () => { if (--pending === 0) readAll(); }));
        });
        readAll();
      }
    };
    const entries = [];
    for (const it of items) { const entry = it.webkitGetAsEntry && it.webkitGetAsEntry(); if (entry) entries.push(entry); }
    if (!entries.length) return;
    let pending = entries.length;
    entries.forEach(en => traverse(en, () => { if (--pending === 0 && files.length) handleFiles(files); }));
  });

  // Search
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    renderPrototypes(filterPrototypes(q));
  });

  // Extension download
  document.getElementById('extensionBtn').addEventListener('click', downloadExtension);
  document.getElementById('loginBtn').addEventListener('click', () => { location.href = '/login.html'; });
  document.getElementById('userPill').addEventListener('click', (e) => {
    e.stopPropagation();
    const dropdown = document.getElementById('userDropdown');
    const isOpen = dropdown.classList.toggle('show');
    document.getElementById('userPill').setAttribute('aria-expanded', String(isOpen));
  });
  document.getElementById('profileBtn').addEventListener('click', () => {
    document.getElementById('userDropdown').classList.remove('show');
    showToast('个人资料功能开发中', 'info');
  });
  document.getElementById('settingsMenuBtn').addEventListener('click', () => {
    document.getElementById('userDropdown').classList.remove('show');
    showToast('设置功能开发中', 'info');
  });
  document.getElementById('menuLogoutBtn').addEventListener('click', logout);
  document.getElementById('doLoginBtn').addEventListener('click', () => submitAuth('login'));
  document.getElementById('registerBtn').addEventListener('click', () => submitAuth('register'));
  document.getElementById('adminBtn').addEventListener('click', () => {
    openModal('adminModal');
    loadAdminUsers();
  });

  // Share modal buttons
  document.getElementById('copyShareBtn').addEventListener('click', () => {
    const input = document.getElementById('shareInput');
    input.select();
    navigator.clipboard.writeText(input.value).then(() => showToast('链接已复制', 'success'));
  });
  document.getElementById('openShareBtn').addEventListener('click', () => {
    window.open(document.getElementById('shareInput').value, '_blank');
  });

  // Group modal save
  document.getElementById('groupSaveBtn').addEventListener('click', saveGroup);

  // Confirm modal
  document.getElementById('confirmOkBtn').addEventListener('click', async () => {
    if (!confirmCallback) {
      closeModal('confirmModal');
      return;
    }
    const callback = confirmCallback;
    const result = await callback();
    if (result !== false) {
      confirmCallback = null;
      closeModal('confirmModal');
      document.getElementById('confirmModal').classList.remove('compact-form');
    }
  });

  // Close modal on overlay click
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal(overlay.id);
    });
  });
  document.addEventListener('click', (e) => {
    const userMenu = document.getElementById('userMenu');
    if (!userMenu.contains(e.target)) {
      document.getElementById('userDropdown').classList.remove('show');
      document.getElementById('userPill').setAttribute('aria-expanded', 'false');
    }
  });

  // Escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.show').forEach(m => closeModal(m.id));
      document.getElementById('userDropdown').classList.remove('show');
      document.getElementById('userPill').setAttribute('aria-expanded', 'false');
    }
  });
}

// ===== Auth & Quota =====
async function refreshAuthState() {
  try {
    const res = await authFetch(`${API}/api/auth/me`, { cache: 'no-store' });
    const data = await res.json();
    currentUser = data.user || null;
    currentUsage = data.usage || null;
    renderAuthState();
    return !!currentUser;
  } catch (e) {
    currentUser = null;
    currentUsage = null;
    document.getElementById('protoList').innerHTML = `
      <div class="empty-state">
        <p>登录状态检查失败</p>
        <p class="hint">${escapeHtml(e.message || '请刷新后重试')}</p>
      </div>`;
    return false;
  }
}

function renderAuthState() {
  const loginBtn = document.getElementById('loginBtn');
  const adminBtn = document.getElementById('adminBtn');
  const userPill = document.getElementById('userPill');
  const userMenu = document.getElementById('userMenu');
  const userDropdown = document.getElementById('userDropdown');
  const quotaStrip = document.getElementById('quotaStrip');
  const quotaText = document.getElementById('quotaText');

  if (!currentUser) {
    localStorage.removeItem('wc_auth_token');
    location.replace('/login.html');
    adminBtn.style.display = 'none';
    userPill.classList.remove('show');
    userMenu.classList.remove('show');
    userDropdown.classList.remove('show');
    quotaStrip.classList.remove('show');
    return;
  }

  loginBtn.style.display = 'none';
  adminBtn.style.display = currentUser.role === 'admin' ? '' : 'none';
  const displayName = currentUser.name || currentUser.email || '用户';
  userPill.innerHTML = `
    <span class="user-avatar"><img src="/logo.png" alt=""></span>
    <span class="user-name">${escapeHtml(displayName)}</span>
    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  `;
  userPill.classList.add('show');
  userMenu.classList.add('show');

  const quota = currentUser.quota || {};
  const usage = currentUsage || {};
  const projectLimit = quota.projectLimit < 0 ? '不限' : quota.projectLimit;
  const storageLimit = quota.storageLimitBytes < 0 ? '不限' : formatSize(quota.storageLimitBytes);
  quotaText.innerHTML = `当前账号配额：<b>${usage.projectCount || 0}</b> / <b>${projectLimit}</b> 个项目，空间 <b>${formatSize(usage.storageBytes || 0)}</b> / <b>${storageLimit}</b>`;
  quotaStrip.classList.add('show');
}

async function submitAuth(mode) {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const name = document.getElementById('authName').value.trim();
  if (!email || !password) { showToast('请输入邮箱和密码', 'error'); return; }
  try {
    const res = await fetch(`${API}/api/auth/${mode === 'register' ? 'register' : 'login'}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, name }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '请求失败');
    localStorage.setItem('wc_auth_token', data.token);
    closeModal('authModal');
    showToast(mode === 'register' ? '注册成功' : '登录成功', 'success');
    await refreshAuthState();
    await loadPrototypes();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function logout() {
  try { await authFetch(`${API}/api/auth/logout`, { method: 'POST' }); } catch (e) {}
  localStorage.removeItem('wc_auth_token');
  currentUser = null;
  currentUsage = null;
  renderAuthState();
  await loadPrototypes();
  showToast('已退出登录', 'success');
}

function deleteUserAccount(userId) {

  }
  showConfirm(
    'danger',

async function doDeleteUser(userId) {
  try {
    const res = await authFetch(`${API}/api/admin/users/${userId}`, { method: 'DELETE' });

// ===== Groups =====
async function loadGroups() {
  try {
    const res = await authFetch(`${API}/api/groups`);
    const data = await res.json();
    allGroups = data.groups || [];
    renderGroupTree();
    populateGroupSelects();
  } catch (e) {
    console.error('加载分组失败:', e);
  }
}

function renderGroupTree() {
  const tree = document.getElementById('groupTree');
  const topGroups = allGroups.filter(g => !g.parentId);

  // Count prototypes per group
  const countByGroup = {};
  allPrototypes.forEach(p => {
    if (p.groupId) countByGroup[p.groupId] = (countByGroup[p.groupId] || 0) + 1;
  });
  const ungroupedCount = allPrototypes.filter(p => !p.groupId).length;

  let html = `
    <div class="group-item ${selectedGroupId === 'all' ? 'active' : ''}" data-group-id="all" onclick="selectGroup('all')">
      <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="group-name">全部原型</span>
      <span class="group-count">${allPrototypes.length}</span>
    </div>
    <div class="group-item ${selectedGroupId === 'ungrouped' ? 'active' : ''}" data-group-id="ungrouped" onclick="selectGroup('ungrouped')">
      <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="group-name">未分组</span>
      <span class="group-count">${ungroupedCount}</span>
    </div>`;

  // Render top-level groups with children
  topGroups.forEach(g => {
    const children = allGroups.filter(c => c.parentId === g.id);
    const count = countByGroup[g.id] || 0;
    const isActive = selectedGroupId === g.id;
    const hasChildren = children.length > 0;

    html += `
    <div class="group-item ${isActive ? 'active' : ''}" data-group-id="${g.id}" onclick="selectGroup('${g.id}')">
      ${hasChildren
        ? `<span class="group-expand" onclick="event.stopPropagation(); toggleGroupExpand('${g.id}', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>`
        : '<span class="group-expand-placeholder"></span>'}
      <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="group-name">${escapeHtml(g.name)}</span>
      <span class="group-count">${count}</span>
      <div class="group-actions">
        <button onclick="event.stopPropagation(); openGroupModal('${g.id}')" title="编辑">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
        <button class="danger" onclick="event.stopPropagation(); confirmDeleteGroup('${g.id}', '${escapeHtml(g.name)}')" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </div>`;

    if (hasChildren) {
      html += `<div class="group-children" id="children-${g.id}" style="display:none;">`;
      children.forEach(c => {
        const cCount = countByGroup[c.id] || 0;
        const cActive = selectedGroupId === c.id;
        html += `
        <div class="group-item ${cActive ? 'active' : ''}" data-group-id="${c.id}" onclick="selectGroup('${c.id}')">
          <span class="group-expand-placeholder"></span>
          <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span class="group-name">${escapeHtml(c.name)}</span>
          <span class="group-count">${cCount}</span>
          <div class="group-actions">
            <button onclick="event.stopPropagation(); openGroupModal('${c.id}')" title="编辑">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="danger" onclick="event.stopPropagation(); confirmDeleteGroup('${c.id}', '${escapeHtml(c.name)}')" title="删除">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </div>`;
      });
      html += `</div>`;
    }
  });

  tree.innerHTML = html;

  // Restore expanded state
  document.querySelectorAll('.group-expand.expanded').forEach(el => {
    const id = el.closest('.group-item').dataset.groupId;
    const children = document.getElementById('children-' + id);
    if (children) children.style.display = 'block';
  });
}

function toggleGroupExpand(groupId, el) {
  const children = document.getElementById('children-' + groupId);
  if (!children) return;
  const isExpanded = children.style.display === 'block';
  children.style.display = isExpanded ? 'none' : 'block';
  el.classList.toggle('expanded', !isExpanded);
}

function selectGroup(groupId) {
  selectedGroupId = groupId;
  // Update active states
  document.querySelectorAll('.group-item').forEach(item => {
    item.classList.toggle('active', item.dataset.groupId === groupId);
  });
  // Update title
  let title = '全部原型';
  if (groupId === 'ungrouped') title = '未分组';
  else if (groupId !== 'all') {
    const g = allGroups.find(g => g.id === groupId);
    title = g ? g.name : '原型管理';
  }
  document.getElementById('mainTitle').textContent = title;
  // Re-render filtered list
  renderPrototypes(filterPrototypes());
}

function filterPrototypes(searchQuery) {
  let filtered = allPrototypes;
  if (selectedGroupId === 'ungrouped') {
    filtered = filtered.filter(p => !p.groupId);
  } else if (selectedGroupId !== 'all') {
    filtered = filtered.filter(p => p.groupId === selectedGroupId);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(p => p.name.toLowerCase().includes(q) || p.token.toLowerCase().includes(q));
  }
  return filtered;
}

function populateGroupSelects() {
  // Populate group select in upload modal
  const select = document.getElementById('groupSelect');
  const currentVal = select.value;
  let options = '<option value="">不选择分组</option>';
  const topGroups = allGroups.filter(g => !g.parentId);
  topGroups.forEach(g => {
    options += `<option value="${g.id}">${escapeHtml(g.name)}</option>`;
    const children = allGroups.filter(c => c.parentId === g.id);
    children.forEach(c => {
      options += `<option value="${c.id}">　└ ${escapeHtml(c.name)}</option>`;
    });
  });
  select.innerHTML = options;
  select.value = currentVal;

  // Populate parent group select in group modal
  const parentSelect = document.getElementById('parentGroupSelect');
  let parentOptions = '<option value="">无（顶级分组）</option>';
  topGroups.forEach(g => {
    parentOptions += `<option value="${g.id}">${escapeHtml(g.name)}</option>`;
  });
  parentSelect.innerHTML = parentOptions;
}

function openGroupModal(groupId) {
  editingGroupId = groupId || null;
  const isEdit = !!groupId;
  document.getElementById('groupModalTitle').textContent = isEdit ? '编辑分组' : '新建分组';
  document.getElementById('groupSaveBtn').textContent = isEdit ? '保存' : '创建';

  if (isEdit) {
    const g = allGroups.find(g => g.id === groupId);
    if (g) {
      document.getElementById('groupNameInput').value = g.name;
      document.getElementById('parentGroupSelect').value = g.parentId || '';
      // When editing a group that has children, can't change parent
      const hasChildren = allGroups.some(c => c.parentId === groupId);
      document.getElementById('parentGroupField').style.display = hasChildren ? 'none' : 'block';
    }
  } else {
    document.getElementById('groupNameInput').value = '';
    document.getElementById('parentGroupSelect').value = '';
    document.getElementById('parentGroupField').style.display = 'block';
  }

  openModal('groupModal');
  setTimeout(() => document.getElementById('groupNameInput').focus(), 100);
}

async function saveGroup() {
  const name = document.getElementById('groupNameInput').value.trim();
  if (!name) { showToast('分组名称不能为空', 'error'); return; }
  const parentId = document.getElementById('parentGroupSelect').value || null;

  try {
    if (editingGroupId) {
      const res = await authFetch(`${API}/api/groups/${editingGroupId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, parentId })
      });
      if (!res.ok) { const d = await res.json(); showToast(d.error || '更新失败', 'error'); return; }
      showToast('分组已更新', 'success');
    } else {
      const res = await authFetch(`${API}/api/groups`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, parentId })
      });
      if (!res.ok) { const d = await res.json(); showToast(d.error || '创建失败', 'error'); return; }
      showToast('分组已创建', 'success');
    }
    closeModal('groupModal');
    await loadGroups();
  } catch (e) {
    showToast('操作失败：' + e.message, 'error');
  }
}

function confirmDeleteGroup(groupId, name) {
  showConfirm(
    'danger',
    '删除分组',
    `确定要删除分组「${name}」吗？\n\n子分组将一并删除，分组下的原型将变为未分组。`,
    () => doDeleteGroup(groupId)
  );
}

async function doDeleteGroup(groupId) {
  try {
    const res = await authFetch(`${API}/api/groups/${groupId}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    showToast('分组已删除', 'success');
    if (selectedGroupId === groupId) selectGroup('all');
    await loadGroups();
    await loadPrototypes();
  } catch (e) {
    showToast('删除失败：' + e.message, 'error');
  }
}

// ===== Load Prototypes =====
async function loadPrototypes() {
  try {
    const res = await authFetch(`${API}/api/prototypes`);
    const data = await res.json();
    allPrototypes = data.prototypes || [];
    renderGroupTree();
    renderPrototypes(filterPrototypes());
  } catch (e) {
    document.getElementById('protoList').innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>加载失败：${e.message}</p>
        <p class="hint">请确认服务已启动</p>
      </div>`;
  }
}

function goBackFromEmpty() {
  if (selectedGroupId && selectedGroupId !== 'all') {
    const currentGroup = allGroups.find(g => g.id === selectedGroupId);
    if (currentGroup && currentGroup.parentId) {
      selectGroup(currentGroup.parentId);
      return;
    }
    selectGroup('all');
    return;
  }
  if (document.referrer && document.referrer !== location.href) {
    history.back();
    return;
  }
  location.href = '/';
}

// ===== Helper Functions =====
function getStatusInfo(status) {
  const map = {
    'ready': { label: '已发布', color: 'var(--accent)' },
    'cleared': { label: '已清空', color: 'var(--warning)' },
    'uploading': { label: '上传中', color: '#1890ff' },
    'updating': { label: '更新中', color: '#1890ff' },
    'unknown': { label: '未知', color: 'var(--muted)' },
  };
  return map[status] || map.unknown;
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 604800) return Math.floor(diff / 86400) + ' 天前';
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  return `${y}-${m}-${day} ${h}:${min}`;
}

function formatSize(bytes) {
  const n = Number(bytes) || 0;
  if (n <= 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), units.length - 1);
  return `${parseFloat((n / Math.pow(1024, i)).toFixed(1))} ${units[i]}`;
}

function escapeHtml(str) {
  return String(str || '').replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) {
  const modal = document.getElementById(id);

// ===== File Upload =====
async function pMap(items, fn, concurrency = 5) {
  let i = 0;
  const workers = Array(Math.min(concurrency, items.length)).fill(0).map(async () => {
    while (i < items.length) { const idx = i++; await fn(items[idx], idx); }
  });
  await Promise.all(workers);
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  const chunks = [];
  for (let i = 0; i < bytes.length; i += 8192) {
    chunks.push(String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)));
  }
  return btoa(chunks.join(''));
}

async function postJSONWithRetry(url, body, retries = 3) {
  let lastError = '';
  for (let attempt = 0; attempt < retries; attempt++) {
    try {
      const res = await authFetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) return;
      lastError = await responseError(res);
      if (res.status === 403) throw new Error(lastError);
    } catch (e) {
      lastError = e.message || '网络错误';
      if (String(lastError).includes('配额')) throw e;
    }
    if (attempt < retries - 1) {
      await new Promise(resolve => setTimeout(resolve, 350 * (attempt + 1)));
    }
  }
  throw new Error(lastError || '上传接口错误');
}

async function uploadFileObjectsInBatches({ fileObjs, token, onProgress }) {
  const maxBatchBytes = 1.5 * 1024 * 1024;
  const maxBatchFiles = 40;
  let done = 0;
  let failed = 0;
  const failedPaths = [];
  const fetchedFiles = [];
  const batches = [];
  let current = [];
  let currentBytes = 0;

  function flushBatch() {
    if (!current.length) return;
    batches.push(current);
    current = [];
    currentBytes = 0;
  }

  await pMap(fileObjs, async ({ file, path }, index) => {
    try {
      const buf = await file.arrayBuffer();
      const item = {
        path,
        content: arrayBufferToBase64(buf),
        size: buf.byteLength,
        order: index,
      };
      fetchedFiles.push(item);
    } catch (e) {
      failed++;
      failedPaths.push(`${path}（${e.message || '读取失败'}）`);
    }
  }, 6);

  fetchedFiles.sort((a, b) => a.order - b.order);
  for (const item of fetchedFiles) {
    if (item.size > maxBatchBytes) {
      flushBatch();
      batches.push([item]);
    } else {
      if (current.length >= maxBatchFiles || currentBytes + item.size > maxBatchBytes) flushBatch();
      current.push(item);
      currentBytes += item.size;
    }
  }
  flushBatch();

  for (const batch of batches) {
    try {
      if (batch.length === 1 && batch[0].size > maxBatchBytes) {
        await postJSONWithRetry(`${API}/api/prototypes/${token}/files`, {
          path: batch[0].path,
          content: batch[0].content,
        });
      } else {
        await postJSONWithRetry(`${API}/api/prototypes/${token}/files/batch`, {
          files: batch.map(({ path, content }) => ({ path, content })),
        });
      }
      done += batch.length;
    } catch (e) {
      failed += batch.length;
      batch.forEach(item => failedPaths.push(`${item.path}（${e.message || '上传失败'}）`));
      done += batch.length;
    }
    onProgress(done, fileObjs.length, failed);
  }

  return { failed, failedPaths };
}

async function handleFiles(files) {
  const stripTop = (p) => p.split('/').slice(1).join('/') || p;
  const fileObjs = files.map(f => ({ file: f, path: stripTop(f.webkitRelativePath) })).filter(o => o.path);
  if (!fileObjs.length) { showToast('未读取到有效文件', 'error'); return; }

  const isUpdate = !!updatingToken;
  const projectName = document.getElementById('projectNameInput').value.trim();
  if (!isUpdate && !projectName) {
    showToast('请输入项目名称', 'error');
    document.getElementById('projectNameInput').focus();
    return;
  }
  const selectedGroup = document.getElementById('groupSelect').value || null;

  const progEl = document.getElementById('uploadProgress');
  const progFill = document.getElementById('progFill');
  const progStatus = document.getElementById('progStatus');
  const progDone = document.getElementById('progDone');
  const progTotal = document.getElementById('progTotal');
  const uploadArea = document.getElementById('uploadArea');

  progEl.style.display = 'block';
  uploadArea.style.opacity = '0.5';
  uploadArea.style.pointerEvents = 'none';
  progFill.style.width = '0%';
  progDone.textContent = '0';
  progTotal.textContent = fileObjs.length;
  progStatus.textContent = isUpdate ? '清空旧文件...' : '创建原型...';

  let token;
  if (isUpdate) {
    try {
      const res = await authFetch(`${API}/api/prototypes/${updatingToken}/update`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      if (!res.ok) throw new Error(await responseError(res));
      token = updatingToken;
    } catch (e) {
      showToast('更新失败：' + e.message, 'error');
      resetUploadArea();
      return;
    }
  } else {
    try {
      const res = await authFetch(`${API}/api/prototypes`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: projectName, groupId: selectedGroup })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '创建失败');
      token = data.token;
    } catch (e) {
      showToast('创建失败：' + e.message, 'error');
      resetUploadArea();
      return;
    }
  }

  progStatus.textContent = '上传文件中...';
  const { failed, failedPaths } = await uploadFileObjectsInBatches({
    fileObjs,
    token,
    onProgress(done, total, failedCount) {
      progDone.textContent = done;
      progFill.style.width = (done / total * 100) + '%';
      progStatus.textContent = failedCount > 0 ? `上传文件中...（${failedCount} 个失败）` : '上传文件中...';
    },
  });

  if (failed > 0) {
    const sample = failedPaths.slice(0, 5).join('；');
    showToast(`有 ${failed} 个资源未上传，已停止发布。请重新上传。失败示例：${sample}`, 'error');
    resetUploadArea();
    return;
  }

  progStatus.textContent = '发布中...';
  try {
    const res = await authFetch(`${API}/api/prototypes/${token}/publish`, { method: 'POST' });
    if (!res.ok) throw new Error(await responseError(res));
    const data = await res.json();
  } catch (e) {
    showToast('发布失败：' + e.message, 'error');
    resetUploadArea();
    return;
  }

  // Success
  progStatus.textContent = isUpdate ? '更新完成！' : '上传完成！';
  showToast(isUpdate ? '原型更新成功' : '原型上传成功', 'success');

  setTimeout(() => {
    closeModal('uploadModal');
    resetUploadArea();
    loadPrototypes();
    updatingToken = null;
    // Show share link for new uploads
    if (!isUpdate) {
      setTimeout(() => sharePrototype(token, projectName), 300);
    }
  }, 800);
}

function resetUploadArea() {
  const uploadArea = document.getElementById('uploadArea');
  uploadArea.style.opacity = '';
  uploadArea.style.pointerEvents = '';
  document.getElementById('uploadProgress').style.display = 'none';
  updatingToken = null;
}
